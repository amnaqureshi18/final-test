<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سورۃ یوسف - فائنل آن لائن ٹیسٹ</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        :root {
            --primary: #1b4332;
            --secondary: #d4a373;
            --accent: #52b788;
            --bg: #f4f6f4;
            --card-bg: #ffffff;
            --text: #2d3748;
            --border: #cbd5e0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Noto Nastaliq Urdu', 'Amiri', serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8e9 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 2px solid #c8e6c9;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
        }
        .header h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #ffffff;
        }
        .header p {
            font-size: 1.1rem;
            color: #e0f2f1;
        }
        .content {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--primary);
            font-size: 1.1rem;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Noto Nastaliq Urdu', serif;
            transition: all 0.3s;
        }
        input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(82, 183, 136, 0.2);
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Noto Nastaliq Urdu', serif;
            transition: background 0.3s, transform 0.1s;
            display: block;
            width: 100%;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:hover {
            background: #2d6a4f;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .question-card {
            background: #fdfefe;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            transition: all 0.3s;
        }
        .question-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 15px;
            line-height: 1.6;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.05rem;
            pointer-events: auto !important;
        }
        .option-label:hover {
            background: #edf2f7;
            border-color: var(--accent);
        }
        .option-label input {
            margin-left: 12px;
            transform: scale(1.2);
            pointer-events: auto !important;
        }
        .option-label.locked {
            cursor: not-allowed;
            opacity: 0.8;
            pointer-events: none !important;
        }
        .hidden {
            display: none !important;
        }
        .alert-box {
            background: #fff3cd;
            color: #856404;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ffeeba;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
        .result-container {
            text-align: center;
            padding: 40px 20px;
        }
        .score-circle {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 25px rgba(27, 67, 50, 0.3);
            border: 5px solid var(--secondary);
        }
        .score-circle span {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .score-circle small {
            font-size: 1rem;
            opacity: 0.9;
        }
        .result-message {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: var(--primary);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>آن لائن کورس فائنل ٹیسٹ</h1>
            <p>سورۃ یوسف (احسن القصص) - معلمہ: بسما عرفان</p>
        </div>
        <div class="content">
            <!-- Alert Box / Status -->
            <div id="alreadySubmittedAlert" class="alert-box hidden">
                آپ اس ٹیسٹ کو پہلے ہی سبمٹ کر چکی ہیں۔ ایک لنک سے دوبارہ ٹیسٹ دینے کی اجازت نہیں ہے۔
            </div>

            <!-- Login / Student Info Screen -->
            <div id="loginScreen">
                <div class="form-group">
                    <label for="studentName">طالبہ کا پورا نام:</label>
                    <input type="text" id="studentName" placeholder="اپنا نام یہاں درج کریں..." required>
                </div>
                <div class="form-group">
                    <label for="studentEmail">ای میل یا واٹس ایپ نمبر:</label>
                    <input type="text" id="studentEmail" placeholder="رابطہ نمبر یا ای میل درج کریں..." required>
                </div>
                <button class="btn" type="button" id="startBtn">ٹیسٹ شروع کریں</button>
            </div>

            <!-- Quiz Screen -->
            <div id="quizScreen" class="hidden">
                <div id="questionsContainer"></div>
                <button class="btn" type="button" id="submitBtn">ٹیسٹ سبمٹ کریں</button>
            </div>

            <!-- Result Screen -->
            <div id="resultScreen" class="hidden">
                <div class="result-container">
                    <div class="result-message" id="congratsMsg">ٹیسٹ کامیابی سے جمع ہو گیا ہے!</div>
                    <div class="score-circle">
                        <span id="percentageDisplay">0%</span>
                        <small id="scoreDisplay">0 / 50</small>
                    </div>
                    <p style="font-size: 1.1rem; line-height: 1.8; color: #4a5568;" id="feedbackText">
                        آپ کا نتیجہ معلمہ (بِسما عرفان) کو کامیابی سے ارسال کر دیا گیا ہے۔ جزاک اللہ خیر!
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const quizData = [
            {id: 1, question: "سوال 1: سورۃ یوسف کے شروع میں آنے والے حروفِ مقطعات کیا ہیں؟", options: ["الف) الم (Alif-Laam-Meem)", "ب) الر (Alif-Laam-Ra)", "ج) طه (Ta-Ha)", "د) يس (Ya-Sin)"], answer: 1},
            {id: 2, question: "سوال 2: آیت نمبر 3 میں قرآن پاک نے سورۃ یوسف کے قصے کو کیا نام دیا ہے؟", options: ["الف) احسن القصص (بہترین قصص)", "ب) خیر الحدیث", "ج) قصص الانبیاء", "د) عظیم البیان"], answer: 0},
            {id: 3, question: "سوال 3: حضرت یوسف علیہ السلام نے اپنے بچپن کے خواب میں کتنی آسمانی چیزوں کو اپنے سامنے سجدہ کرتے دیکھا تھا؟", options: ["الف) سات ستارے، سورج اور چاند", "ب) گیارہ ستارے، سورج اور چاند", "ج) بارہ ستارے اور چاند", "د) دس ستارے اور سورج"], answer: 1},
            {id: 4, question: "سوال 4: حضرت یعقوب علیہ السلام نے خواب سننے کے بعد یوسف علیہ السلام کو کیا نصیحت کی تھی؟", options: ["الف) کہ یہ خواب فوراً اپنے بھائیوں کو سنا دو", "ب) کہ اسے کسی کتاب میں لکھ لو", "ج) کہ اپنا خواب اپنے بھائیوں کو نہ بتانا، مبادا وہ تمہارے خلاف کوئی سازش کریں", "د) کہ گھر چھوڑ کر چلے جاؤ"], answer: 2},
            {id: 5, question: "سوال 5: حضرت یوسف علیہ السلام کے بھائی ان سے شدید حسد کیوں کرتے تھے؟", options: ["الف) کیونکہ یوسف ان سب سے عمر میں بڑے تھے", "ب) کیونکہ وہ سمجھتے تھے کہ ان کے والد یوسف اور ان کے سگے بھائی (بنیامین) کو ان سے زیادہ چاہتے ہیں", "ج) کیونکہ یوسف ان کے ساتھ کام کرنے سے انکار کرتے تھے", "د) کیونکہ یوسف خاندان کی زمین چھوڑنا چاہتے تھے"], answer: 1},
            {id: 6, question: "سوال 6: سمجھدار بھائی نے یوسف کو قتل کرنے کے بجائے کیا متبادل رائے دی تھی؟", options: ["الف) انہیں گزرنے والے مسافروں کے ہاتھ بطور خادم بیچ دیا جائے", "ب) انہیں کسی کنویں کی گہرائی میں ڈال دیا جائے", "ج) انہیں کسی دور دراز شہر میں چھوڑ دیا جائے", "د) انہیں ایک کمرے میں بند کر دیا جائے"], answer: 1},
            {id: 7, question: "سوال 7: بھائی یوسف کی موت کا جھوٹا ثبوت دینے کے لیے حضرت یعقوب علیہ السلام کے پاس کیا لائے تھے؟", options: ["الف) جھوٹے خون سے رنگا ہوا قمیض", "ب) ان کی ذاتی انگوٹھی", "ج) جنگل میں پڑی ہوئی ان کی جتی", "د) ایک ٹوٹی ہوئی لاٹھی"], answer: 0},
            {id: 8, question: "سوال 8: جب بھائیوں نے یہ خبر دی کہ یوسف کو بھیڑیا کھا گیا ہے، تو حضرت یعقوب علیہ السلام نے کیا ردعمل ظاہر کیا؟", options: ["الف) وہ سخت غصے میں آگئے اور انہیں بددعا دی", "ب) انہوں نے صبرِ جمیل کیا اور صرف اللہ کی طرف رجوع کیا", "ج) انہوں نے خود جنگل میں تلاش شروع کر دی", "د) انہوں نے سب کو گھر سے نکال دیا"], answer: 1},
            {id: 9, question: "سوال 9: حضرت یوسف علیہ السلام کو کنویں سے کس نے نکالا؟", options: ["الف) مقامی کسانوں کا ایک گروہ", "ب) مسافروں کا ایک قافلہ جن نے اپنا پانی نکالنے والا (ڈولچی) بھیجا تھا", "ج) مصر کے بادشاہ کے سپاہی", "د) بکریاں چرانے والے گڈریے"], answer: 1},
            {id: 10, question: "سوال 10: مصر میں فروخت کیے جانے پر یوسف علیہ السلام کا کیا معاملہ کیا گیا؟", options: ["الف) انہیں ایک شہزادے کی طرح مہنگے داموں بیچا گیا", "ب) انہیں بہت کم داموں میں چند گنتی کے درہموں کے بدلے بیچا گیا", "ج) انہیں بادشاہ کو بطورِ تحفہ مفت دے دیا گیا", "د) انہیں ایک آزاد تاجر کے طور پر رکھا گیا"], answer: 1},
            {id: 11, question: "سوال 11: مصر میں حضرت یوسف علیہ السلام کو کس نے خریدا؟", options: ["الف) مصر کے فرعون (بادشاہ) نے براہِ راست", "ب) مصر کے ایک معزز وزیر (عزیزِ مصر) نے", "ج) کنعان کے ایک امیر تاجر نے", "د) جیل کے چیف گارڈ نے"], answer: 1},
            {id: 12, question: "سوال 12: جب یوسف علیہ السلام جوانی کو پہنچے تو اللہ نے انہیں کیا خاص نعمت عطا فرمائی؟", options: ["الف) بے پناہ جسمانی طاقت اور فنِ سپہ گری", "ب) حکمت اور علم (دانائی اور شریعت کی سمجھ)", "ج) موسم کو کنٹرول کرنے کی صلاحیت", "د) پورے مصر میں بے پناہ دولت"], answer: 1},
            {id: 13, question: "سوال 13: عزیزِ مصر کے گھر میں زلیخا کی طرف سے یوسف علیہ السلام کو کس آزمائش کا سامنا کرنا پڑا؟", options: ["الف) اس نے انہیں حکومتی راز چرانے پر مجبور کرنے کی کوشش کی", "ب) اس نے دروازے بند کر کے انہیں اپنی طرف مائل کرنا چاہا، لیکن یوسف نے اللہ کی پناہ مانگی", "ج) اس نے انہیں بغیر آرام کے طویل گھنٹے کام کرنے پر مجبور کیا", "د) اس نے انہیں محل سے نکالنے کی کوشش کی"], answer: 1},
            {id: 14, question: "سوال 14: جب گھر کے مالک نے دروازے پر دونوں کو دیکھا تو کس ثبوت نے یوسف علیہ السلام کی پاک دامن ہونے کو ظاہر کیا؟", options: ["الف) ایک گواہ نے گواہی دی کہ یوسف کی قمیض پیچھے سے پھٹی ہوئی ہے", "ب) زلیخا نے ندامت سے فوراً اعتراف کر لیا", "ج) کھڑکی سے ایک پرندے نے بول کر گواہی دی", "د) عزیز نے خواب میں سچائی دیکھ لی تھی"], answer: 0},
            {id: 15, question: "سوال 15: شہر کی معزز عورتوں نے جب عزیز کی بیوی کے بارے میں چرچا سنا کہ وہ اپنے غلام پر فدا ہو گئی ہے تو انہوں نے کیا کیا؟", "options": ["الف) انہوں نے اس افواہ پر بالکل توجہ نہ دی", "ب) انہوں نے یوسف کو دعوت دی، اور ان کا حسن دیکھ کر حیرت میں اپنے ہاتھ کاٹ بیٹھیں", "ج) انہوں نے بادشاہ کو باضابطہ شکایت خط لکھا", "د) انہوں نے مطالبہ کیا کہ یوسف کو شہر سے جلاوطن کر دیا جائے"], answer: 1},
            {id: 16, question: "سوال 16: عورتوں کی طرف سے ناپسندیدہ اور گناہ کی دعوت دیے جانے پر یوسف علیہ السلام نے کس چیز کو ترجیح دی؟", "options": ["الف) صحرا میں بھاگ جانے کو", "ب) جیل جانے کو، جسے انہوں نے عورتوں کی دعوت سے زیادہ پسند کیا", "ج) محل کے محافظوں کے ساتھ لڑائی کرنے کو", "د) غم کے مارے خودکشی کرنے کو"], answer: 1},
            {id: 17, question: "سوال 17: باوجود بے گناہ ہونے کے، حضرت یوسف علیہ السلام کو آخر کار جیل کیوں بھیج دیا گیا؟", "options": ["الف) عوام میں چرچا کم کرنے اور وقتی طور پر سزا کا دکھاوا کرنے کے لیے", "ب) اس لیے کہ انہوں نے کوئی چھوٹی موٹی چوری کی تھی", "ج) اس لیے کہ انہوں نے عزیزِ مصر کی توہین کی تھی", "د) اس لیے کہ انہوں نے مصر سے بھاگنے کی کوشش کی تھی"], answer: 0},
            {id: 18, question: "سوال 18: جیل میں یوسف علیہ السلام کے ساتھ اور کون سے دو قیدی داخل ہوئے جنہیں خواب آئے تھے؟", "options": ["الف) بادشاہ کے دو خاص محافظ", "ب) بادشاہ کے دو نوجوان ملازم (ایک نانبائی/بیکر اور ایک ساقی/شراب پلانے والا)", "ج) دو شاہی شہزادے", "د) دو غیر ملکی جاسوس"], answer: 1},
            {id: 19, question: "سوال 19: خوابوں کی تعبیر بتانے سے پہلے یوسف علیہ السلام نے اپنے ساتھی قیدیوں کو کیا بنیادی دعوت دی؟", "options": ["الف) توحید کی دعوت دی اور سمجھایا کہ حُکم صرف اللہ کا چلتا ہے", "ب) زبردست زلزلے کی پیشگوئی سے خبردار کیا", "ج) جیل سے فرار ہونے کا طریقہ سکھایا", "د) مصر کی حکومت کے خاتمے کی پیشگوئی کی"], answer: 0},
            {id: 20, question: "سوال 20: ساقی (شراب پلانے والے) کا خواب کیا تھا؟", "options": ["الف) یہ کہ وہ انگور نچوڑ کر اپنے آقا کے لیے شراب تیار کر رہا ہے", "ب) یہ کہ وہ اپنے سر پر روٹیوں کی تین ٹوکریاں اٹھائے ہوئے ہے", "ج) یہ کہ وہ سونے کے پیالے سے پانی پی رہا ہے", "د) یہ کہ وہ زیتون کے باغ کی دیکھ بھال کر رہا ہے"], answer: 0},
            {id: 21, question: "سوال 21: نانبائی (بیکر) کا خواب کیا تھا؟", "options": ["الف) یہ کہ وہ سر پر روٹیاں اٹھائے ہوئے ہے اور پرندے اس میں سے کھا رہے ہیں", "ب) یہ کہ وہ دہکتی ہوئی آگ میں روٹیاں پکا رہا ہے", "ج) یہ کہ وہ شہر کے بازار میں پیسٹری بیچ رہا ہے", "د) یہ کہ وہ شاہی خاندان کے ساتھ شہد کھا رہا ہے"], answer: 0},
            {id: 22, question: "سوال 22: یوسف علیہ السلام نے ساقی کے خواب کی کیا تعبیر بتائی؟", "options": ["الف) اسے تین دن کے اندر پھانس دے دی جائے گی", "ب) وہ رہا ہو جائے گا اور اپنے پرانے عہدے (بادشاہ کے ساقی) پر بحال ہو جائے گا", "ج) وہ کسی صوبے کا گورنر بن جائے گا", "د) وہ تاحیات جیل ہی میں رہے گا"], answer: 1},

            {id: 25, question: "سوال 25: شیطان کی بھول کی وجہ سے ساقی بادشاہ سے ذکر کرنا بھول گیا اور یوسف کتنے سال جیل میں رہے؟", "options": ["الف) چند ماہ", "ب) کئی سال (قرآن میں \"بِضع سنين\" یعنی چند سال کا ذکر ہے)", "ج) بالکل ایک سال", "د) پورے دس سال"], answer: 1},
            {id: 26, question: "سوال 26: مصر کے بادشاہ کو اپنے کس خواب نے سخت پریشان کیا تھا؟", "options": ["الف) سات موٹی گائیوں کو سات لاغر گائیں کھا رہی ہیں، اور سات سبز بالیں ہیں اور سات سوکھی ہوئی", "ب) ایک بڑا سیلاب پوری سلطنت کو غرق کر رہا ہے", "ج) آسمان سے محل پر آگ نازل ہو رہی ہے", "د) ستارے آسمان سے نیل کے دریا میں گر رہے ہیں"], answer: 0},
            {id: 27, question: "سوال 27: جب شاہی جادوگر اور درباری تعبیر بتانے سے قاصر رہے تو کس کو یوسف علیہ السلام اور ان کے علمِ تعبیر کا خیال آیا؟", "options": ["الف) عزیزِ مصر کی بیوی کو", "ب) رہا ہونے والے ساقی کو", "ج) جیل کے چیف وارڈن کو", "د) بادشاہ کے ایک پرانے مشیر کو"], answer: 1},

            {id: 29, question: "سوال 29: تحقیق پر عزیز کی بیوی اور شہر کی عورتوں نے بادشاہ کے سامنے کیا اعتراف کیا؟", "options": ["الف) انہوں نے سچ مان لیا کہ یوسف بالکل بے گناہ ہیں اور ہم نے ہی انہیں پھسلانے کی کوشش کی تھی", "ب) انہوں نے الزام لگایا کہ یوسف نے جادو کے ذریعے ہمیں قابو کیا تھا", "ج) انہوں نے اس تمام سازش کا ذمہ دار عزیزِ مصر کو ٹھہرایا", "د) انہوں نے کہا کہ یوسف زبردستی ہمارے کمروں میں گھس آئے تھے"], answer: 0},
            {id: 30, question: "سوال 30: بادشاہ کے سات موٹی اور سات لاغر گائیوں والے خواب کی کیا تعبیر نکلی؟", "options": ["الف) سات سال مسلسل خوشحالی کے بعد سات سال سخت قحط کے آئیں گے", "ب) سات سال جنگ کے بعد سات سال امن کے آئیں گے", "ج) سات ماہ خشک سالی کے بعد زبردست فصل ہوگی", "د) سات طاقتور سلطنتیں سات کمزور ریاستوں کو فتح کریں گی"], answer: 0},
            {id: 31, question: "سوال 31: آنے والے قحط سے نمٹنے کے لیے حضرت یوسف علیہ السلام نے کیا بہترین معاشی حل تجویز کیا؟", "options": ["الف) فوری طور پر پڑوسی ممالک سے غلہ درآمد کیا جائے", "ب) جو غلہ کاٹو اسے اس کی بالیوں ہی میں رہنے دو، سوائے اس تھوڑے غلے کے جو تم کھاؤ، تاکہ وہ کیڑوں سے محفوظ رہے", "ج) فالتو خوراک کو جلا دیا جائے تاکہ قیمتیں بلند رہیں", "د) زمین کے اندر سونے کے خزانے چھپا دیے جائیں"], answer: 1},

            {id: 33, question: "سوال 33: قحط کے سالوں میں یوسف کے بھائی غلہ لینے مصر کیوں آئے تھے؟", "options": ["الف) یوسف کو تلاش کرنے اور معلوم کرنے کے لیے کہ وہ زندہ ہیں یا نہیں", "ب) سرکاری سطح پر تقسیم کیا جانے والا غلہ خریدنے کے لیے", "ج) مویشی اور کپڑے کی تجارت کرنے کے لیے", "د) سیاسی پناہ کی تلاش میں"], answer: 1},
            {id: 34, question: "سوال 34: جب بھائی غلہ لینے آئے تو کیا حضرت یوسف علیہ السلام نے انہیں پہچان لیا؟", "options": ["الف) نہیں، کیونکہ وہ بہت بوڑھے ہو چکے تھے", "ب) ہاں، لیکن بھائیوں نے انہیں نہیں پہچانا", "ج) دونوں طرف سے کوئی کسی کو نہیں پہچان سکا", "د) بھائیوں نے دیکھتے ہی پہچان لیا اور معافی مانگنے لگے"], answer: 1},

            {id: 37, question: "سوال 37: حضرت یعقوب علیہ السلام بنیامین کو بھائیوں کے ساتھ بھیجنے پر کیوں ہچکچا رہے تھے؟", "options": ["الف) کیونکہ بنیامین بہت چھوٹے اور سفر کے لیے کمزور تھے", "ب) کیونکہ انہیں ڈر تھا کہ کہیں یہ بھی اسے ویسے ہی کھو نہ دیں جیسے یوسف کو کھو دیا تھا", "ج) کیونکہ بنیامین والد کا ساتھ چھوڑنا نہیں چاہتے تھے", "د) کیونکہ مصر کے راستے میں ڈاکوؤں کا بہت خطرہ تھا"], answer: 1},
            {id: 38, question: "سوال 38: حضرت یعقوب علیہ السلام نے بیٹوں کو مصر میں داخل ہوتے وقت کیا احتیاطی تدبیر سجھائی تھی؟", "options": ["الف) کہ ایک دروازے سے داخل نہ ہونا بلکہ الگ الگ دروازوں سے داخل ہونا", "ب) کہ کسی دوسرے علاقے کے تاجروں کا بھیس بدل لینا", "ج) کہ حفاظت کے لیے خاص تعویز پہن کر جانا", "د) کہ وزیرِ مصر سے ملاقات ہی مت کرنا"], answer: 0},
            {id: 39, question: "سوال 39: حضرت یوسف علیہ السلام نے تنہائی میں اپنے سگے بھائی بنیامین پر اپنی اصلیت کیسے ظاہر کی؟", "options": ["الف) انہوں نے دربار میں سب کے سامنے بلند آواز میں اعلان کیا", "ب) انہوں نے اسے اپنے پاس بلایا اور سرگوشی میں کہا: \"بلاشبہ میں تیرا بھائی ہوں، تو ان کے پچھلے افعال پر غم نہ کر\"", "ج) انہوں نے اپنی انگوٹھی لگی ہوئی مہر کا خط اسے تھما دیا", "د) انہوں نے پہلے اسے جیل میں ڈالنے کے بعد حقیقت کھولی"], answer: 1},
            {id: 40, question: "سوال 40: بادشاہ کا پیمانہ (شاہی پیالہ) کس کے سامان سے نکلا؟", "options": ["الف) وہ بنیامین کے سامان سے برآمد ہوا", "ب) وہ سب سے بڑے بھائی (روبن) کے بریف کیس/بورے سے نکلا", "ج) ایک محافظ نے بازار میں ایک بھائی کو چوری کرتے رنگے ہاتھوں پکڑا", "د) وہ جان بوجھ کر تخت کے قریب چھوڑ دیا گیا تھا"], answer: 0},

            {id: 42, question: "سوال 42: بنیامین کی رہائی کے لیے بھائیوں نے یوسف علیہ السلام کے سامنے کیا جذباتی التجا کی؟", "options": ["الف) انہوں نے اپنے سارے اونٹ اور دولت فدیے میں پیش کر دی", "ب) انہوں نے کہا کہ اس کا باپ ایک بہت بوڑھا شخص ہے، اس لیے اس کے بدلے ہم میں سے کسی ایک کو رکھ لیجئے", "ج) انہوں نے کنعان کے قبائل سے حملے کی دھمکی دی", "د) انہوں نے وزیر کو چھوڑ کر سیدھا بادشاہ سے اپیل کی"], answer: 1},
            {id: 43, question: "سوال 43: حضرت یوسف علیہ السلام نے تمام بھائیوں کے سامنے آخر کار اپنی اصلیت کب ظاہر کی؟", "options": ["الف) جب وہ پہلی بار مصر آئے تھے", "ب) جب وہ عاجزی و بے بسی کی حالت میں آئے اور یوسف نے پوچھا: \"کیا تمہیں معلوم ہے جو تم نے یوسف اور اس کے بھائی کے ساتھ کیا تھا؟\"", "ج) بادشاہ کی طرف سے دی گئی شاہی دعوت میں", "د) جب ان کے والد یوسف سے ملنے مصر کی سرحد پر پہنچے"], answer: 1},

            {id: 45, question: "سوال 45: حضرت یوسف علیہ السلام نے اپنے بھائیوں کے پچھلے گناہ اور ظلم پر انہیں کیا شاندار معافی نامہ دیا؟", "options": ["الف) \"آج تم پر کوئی سرزنش نہیں، اللہ تمہیں معاف کرے، وہ سب رحم کرنے والوں سے بڑھ کر رحم کرنے والا ہے\"", "ب) \"تمہیں اپنے جرم کی پاداش میں سات سال میرے غلام بن کر رہنا ہوگا\"", "ج) \"میں آج کے بعد کبھی تم سے بات نہیں کروں گا\"", "د) \"تمہیں تب معاف کیا جائے گا جب بھاری جرمانہ ادا کرو گے\""], answer: 0},
            {id: 46, question: "سوال 46: جب یوسف کی قمیض ان کے نابینا والد حضرت یعقوب علیہ السلام کے پاس بھیجی گئی تو اس کا کیا معجزاتی اثر ہوا؟", "options": ["الف) جیسے ہی اسے چہرے پر ڈالا گیا، والد کی بینائی فورا لوٹ آئی اور انہیں یوسف کی خوشبو محسوس ہوئی", "ب) واپسی کے سفر میں اس قمیض نے قافلے کو ڈاکوؤں سے بچایا", "ج) وہ برکت کی علامت کے طور پر خالص ریشم میں بدل گئی", "د) اس سے صحرا میں ایک چشمہ جاری ہو گیا"], answer: 0},
            {id: 47, question: "سوال 47: جب حضرت یعقوب علیہ السلام اور پورا خاندان مصر پہنچا اور یوسف سے ملے تو انہوں نے کیا احترام کیا؟", "options": ["الف) شاہی محافظوں نے انہیں دارالحکومت میں داخلے سے روک دیا", "ب) یوسف نے اپنے والدین کو تخت پر بٹھایا، اور وہ سب احترام اور تحیۃً سجدے میں گر پڑے", "ج) انہوں نے مصر کے باہر خیموں میں مستقل رہنے کو ترجیح دی", "د) انہوں نے شرم کے مارے یوسف کی طرف دیکھنے سے انکار کر دیا"], answer: 1},
            {id: 48, question: "سوال 48: کہانی کے آخر میں حضرت یوسف علیہ السلام نے اپنے بچپن کے خواب کی تعبیر کے بارے میں کیا کہا؟", "options": ["الف) \"اے میرے ابا! یہ میرے اس پہلے خواب کی تعبیر ہے، میرے رب نے اسے سچ کر دکھایا ہے\"", "ب) \"خواب محض خیالی ہوتے ہیں اور ان کی کوئی حقیقت نہیں ہوتی\"", "ج) \"یہ خواب پیشگوئی کے بجائے محض ایک وارننگ تھا\"", "د) \"اس خواب کا صرف ادھا حصہ پورا ہوا ہے\""], answer: 0},
            {id: 49, question: "سوال 49: آیت نمبر 101 میں آزمائشوں کے اختتام پر حضرت یوسف علیہ السلام نے اللہ کے حضور کیا خوبصورت دعا کی تھی؟", "options": ["الف) \"मुझे دائمی جوانی اور دنیاوی حکمرانی عطا فرما\"", "ب) \"اے آسمان و زمین کے پیدا کرنے والے! تو دنیا اور آخرت میں میرا کارساز ہے، مجھے اسلام پر موت دے اور صالحین میں شامل فرما\"", "ج) \"جیل میں مجھ پر ظلم کرنے والوں کو دنیا ہی میں سزا دے\"", "د) \"میرے ملک کو آنے والے تمام قحط سے ہمیشہ کے لیے محفوظ رکھ\""], answer: 1},
            {id: 50, question: "سوال 50: سورۃ یوسف کی آخری آیت (آیت نمبر 111) کیا اہم سبق یا خلاصہ بیان کرتی ہے؟", "options": ["الف) یہ کہ تاریخ محض پرانی کہانیوں کا ایک مجموعہ ہے", "ب) یہ کہ انبیاء کے قصوں میں صاحبانِ عقل کے لیے عبرت ہے، جو اس بات کی تصدیق کرتی ہے کہ قرآن سچی کتاب ہے", "ج) یہ کہ انسان اکیلی عقل اور تدبیر سے اپنی قسمت بدل سکتا ہے", "د) یہ کہ خدا سے رابطہ کرنے کا صرف ایک ہی ذریعہ خواب ہے"], answer: 1}
        ];

        const correctAnswers = {
            1: 1, 2: 0, 3: 1, 4: 2, 5: 1, 6: 1, 7: 0, 8: 1, 9: 1, 10: 1,
            11: 1, 12: 1, 13: 1, 14: 0, 15: 1, 16: 1, 17: 0, 18: 1, 19: 0, 20: 0,
            21: 0, 22: 1, 23: 0, 24: 1, 25: 1, 26: 0, 27: 1, 28: 1, 29: 0, 30: 0,
            31: 1, 32: 1, 33: 1, 34: 1, 35: 1, 36: 1, 37: 1, 38: 0, 39: 1, 40: 0,
            41: 1, 42: 1, 43: 1, 44: 0, 45: 0, 46: 0, 47: 1, 48: 0, 49: 1, 50: 1
        };

        window.addEventListener('DOMContentLoaded', () => {
            const hasSubmitted = localStorage.getItem('surahYusufTestSubmitted');
            if (hasSubmitted === 'true') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('alreadySubmittedAlert').classList.remove('hidden');
            }
        });

        document.getElementById('startBtn').addEventListener('click', function(e) {
            e.preventDefault();
            const name = document.getElementById('studentName').value.trim();
            const contact = document.getElementById('studentEmail').value.trim();
            if(!name || !contact) {
                alert('براہ کرم اپنا نام اور رابطہ درج کریں!');
                return;
            }
            localStorage.setItem('surahYusufStudentName', name);
            localStorage.setItem('surahYusufStudentContact', contact);
            
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('quizScreen').classList.remove('hidden');
            loadQuestions();
        });

        function loadQuestions() {
            const container = document.getElementById('questionsContainer');
            let html = '';
            quizData.forEach((q) => {
                html += `<div class="question-card" id="q-card-${q.id}">
                    <div class="question-title">${q.question}</div>
                    <div class="options-list">`;
                q.options.forEach((opt, optIndex) => {
                    html += `<label class="option-label" id="opt-label-${q.id}-${optIndex}">
                        <input type="radio" name="question_${q.id}" value="${optIndex}" onchange="lockQuestion(${q.id})">
                        ${opt}
                    </label>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function lockQuestion(qid) {
            const qCard = document.getElementById(`q-card-${qid}`);
            const radios = qCard.querySelectorAll('input[type="radio"]');
            radios.forEach(r => r.disabled = true);
            const labels = qCard.querySelectorAll('.option-label');
            labels.forEach(l => l.classList.add('locked'));
        }

        document.getElementById('submitBtn').addEventListener('click', function(e) {
            e.preventDefault();
            let score = 0;
            let answeredCount = 0;

            quizData.forEach(q => {
                const selected = document.querySelector(`input[name="question_${q.id}"]:checked`);
                if(selected) {
                    answeredCount++;
                    const val = parseInt(selected.value);
                    if(val === correctAnswers[q.id]) {
                        score++;
                    }
                }
            });

            if(answeredCount < quizData.length) {
                if(!confirm(`آپ نے ${quizData.length} میں سے ${answeredCount} سوالات حل کیے ہیں۔ کیا آپ پھر بھی ٹیسٹ سبمٹ کرنا چاہتی ہیں؟`)) {
                    return;
                }
            }

            const total = quizData.length;
            const percentage = Math.round((score / total) * 100);

            localStorage.setItem('surahYusufTestSubmitted', 'true');

            document.getElementById('quizScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');
            document.getElementById('scoreDisplay').innerText = `${score} / ${total}`;
            document.getElementById('percentageDisplay').innerText = `${percentage}%`;
        });
    </script>
</body>
